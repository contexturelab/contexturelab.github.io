name: pi-issue-to-pr

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, edited, labeled]

concurrency:
  group: pi-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  process:
    # @pi mention or pi label only (auth check in first step — org-owned repo)
    if: >
      (
        (github.event_name == 'issues' && github.event.action != 'labeled' && contains(github.event.issue.body, '@pi')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'pi') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@pi')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@pi')) ||
        (github.event_name == 'pull_request' && github.event.action != 'labeled' && contains(github.event.pull_request.body, '@pi')) ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'pi')
      )
    runs-on: ubuntu-latest
    # Org forces GITHUB_TOKEN read-only; PI_BOT_TOKEN (PAT) does write.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require PI_BOT_TOKEN + repo owner/admin only
        env:
          PI_BOT_TOKEN: ${{ secrets.PI_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.PI_BOT_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ -z "${PI_BOT_TOKEN:-}" ]; then
            echo "PI_BOT_TOKEN secret missing."
            echo "Org disables write for GITHUB_TOKEN; set a PAT with repo contents+PR+issues."
            exit 1
          fi
          # Repo owner only: user-owned → login == owner; org-owned → admin on repo.
          OWNER="${{ github.repository_owner }}"
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${SENDER}/permission" --jq .permission 2>/dev/null || echo "none")
          echo "sender=${SENDER} owner=${OWNER} permission=${PERM}"
          if [ "$SENDER" = "$OWNER" ] || [ "$PERM" = "admin" ]; then
            echo "auth ok"
          else
            echo "denied: only repo owner/admin may trigger pi (sender=${SENDER}, perm=${PERM})"
            exit 1
          fi

      - name: Resolve context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.PI_BOT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          MODE=""
          NUMBER=""
          TITLE=""
          BODY=""
          BRANCH=""
          BASE_REF="main"
          TRIGGER_COMMENT=""
          PR_NUMBER=""
          ISSUE_NUMBER=""

          case "$EVENT_NAME" in
            issues)
              MODE="issue"
              NUMBER="${{ github.event.issue.number }}"
              TITLE=$(gh issue view "$NUMBER" --repo "$REPO" --json title --jq .title)
              BODY=$(gh issue view "$NUMBER" --repo "$REPO" --json body --jq '.body // empty')
              ISSUE_NUMBER="$NUMBER"
              BRANCH="pi/issue-${NUMBER}"
              ;;
            issue_comment)
              # Issue conversation AND PR conversation comments.
              NUMBER="${{ github.event.issue.number }}"
              TRIGGER_COMMENT=$(gh api "repos/${REPO}/issues/comments/${{ github.event.comment.id }}" --jq .body)
              IS_PR=$(gh api "repos/${REPO}/issues/${NUMBER}" --jq 'if .pull_request then "true" else "false" end')
              if [ "$IS_PR" = "true" ]; then
                MODE="pr"
                PR_NUMBER="$NUMBER"
                TITLE=$(gh pr view "$NUMBER" --repo "$REPO" --json title --jq .title)
                BODY=$(gh pr view "$NUMBER" --repo "$REPO" --json body --jq '.body // empty')
                BRANCH=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
              else
                MODE="issue"
                ISSUE_NUMBER="$NUMBER"
                TITLE=$(gh issue view "$NUMBER" --repo "$REPO" --json title --jq .title)
                BODY=$(gh issue view "$NUMBER" --repo "$REPO" --json body --jq '.body // empty')
                BRANCH="pi/issue-${NUMBER}"
              fi
              ;;
            pull_request)
              MODE="pr"
              NUMBER="${{ github.event.pull_request.number }}"
              PR_NUMBER="$NUMBER"
              TITLE=$(gh pr view "$NUMBER" --repo "$REPO" --json title --jq .title)
              BODY=$(gh pr view "$NUMBER" --repo "$REPO" --json body --jq '.body // empty')
              BRANCH=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
              ;;
            pull_request_review_comment)
              MODE="pr"
              NUMBER="${{ github.event.pull_request.number }}"
              PR_NUMBER="$NUMBER"
              TITLE=$(gh pr view "$NUMBER" --repo "$REPO" --json title --jq .title)
              BODY=$(gh pr view "$NUMBER" --repo "$REPO" --json body --jq '.body // empty')
              BRANCH=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
              META=$(gh api "repos/${REPO}/pulls/comments/${{ github.event.comment.id }}")
              TRIGGER_COMMENT=$(echo "$META" | jq -r .body)
              PATH_HUNK=$(echo "$META" | jq -r '"File: \(.path)\nLine: \(.line // .original_line // "n/a")"')
              TRIGGER_COMMENT="${TRIGGER_COMMENT}

          ${PATH_HUNK}"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [ -n "$TRIGGER_COMMENT" ]; then
            BODY="${BODY}

          ---
          Latest comment that triggered this run:
          ${TRIGGER_COMMENT}"
          fi

          {
            echo "mode=${MODE}"
            echo "number=${NUMBER}"
            echo "issue_number=${ISSUE_NUMBER}"
            echo "pr_number=${PR_NUMBER}"
            echo "branch=${BRANCH}"
            echo "base_ref=${BASE_REF}"
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "mode=${MODE} number=${NUMBER} branch=${BRANCH}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PI_BOT_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Configure git
        run: |
          git config user.name "pi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare working branch
        env:
          MODE: ${{ steps.ctx.outputs.mode }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --prune
          if [ "$MODE" = "pr" ]; then
            # Continue on existing PR head (preserve prior commits)
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            # Fresh issue branch from main each run
            git checkout -B "$BRANCH" "origin/${BASE_REF}"
          fi

      - name: Run pi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_TITLE: ${{ steps.ctx.outputs.title }}
          ISSUE_BODY: ${{ steps.ctx.outputs.body }}
          MODE: ${{ steps.ctx.outputs.mode }}
          NUMBER: ${{ steps.ctx.outputs.number }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY secret is not set"
            exit 1
          fi

          if [ "$MODE" = "pr" ]; then
            KIND="pull request"
          else
            KIND="issue"
          fi

          PROMPT=$(cat <<PROMPT_EOF
          GitHub ${KIND} #${NUMBER}: ${ISSUE_TITLE}

          ${ISSUE_BODY}

          Task:
          - This is a Jekyll site (no-style-please theme) for Contexture Lab.
          - Content pages live as markdown in the repo root (index.md, research.md, people.md, code-data.md, slides.md, artwork.md) and under _posts/ / posts/.
          - Site-wide settings are in _config.yml and _data/.
          - News items often live in _data/news.yml.
          - Make the minimal precise edits needed to satisfy the request (including the latest triggering comment if present).
          - Prefer editing existing files over creating new ones.
          - Do not rewrite unrelated content.
          - Do not commit, push, or open a PR yourself; the workflow handles git.
          - After edits, briefly summarize what you changed.
          PROMPT_EOF
          )

          pi --print \
            --provider openrouter \
            --model "x-ai/grok-4.5" \
            --api-key "$OPENROUTER_API_KEY" \
            --no-session \
            --approve \
            --system-prompt "You are an automated website editor for a Jekyll lab site. Edit files with the built-in tools. Keep changes minimal and correct. Never invent facts about people or papers." \
            "$PROMPT"

      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          MODE: ${{ steps.ctx.outputs.mode }}
          NUMBER: ${{ steps.ctx.outputs.number }}
          TITLE: ${{ steps.ctx.outputs.title }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes from pi."
            exit 0
          fi
          if [ "$MODE" = "pr" ]; then
            MSG="pi: update for PR #${NUMBER}"
          else
            MSG="pi: ${TITLE} (refs #${NUMBER})"
          fi
          git commit -m "$MSG"
          git push -u origin "HEAD:${BRANCH}" --force-with-lease
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update PR (issue mode only)
        id: openpr
        if: steps.commit.outputs.changed == 'true' && steps.ctx.outputs.mode == 'issue'
        env:
          GH_TOKEN: ${{ secrets.PI_BOT_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          TITLE: ${{ steps.ctx.outputs.title }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          BODY="Auto-generated by pi from issue #${ISSUE_NUMBER}.

          Review carefully before merge.

          Trigger: \`@pi\` / label \`pi\` from repo owner/admin only.
          PR conversation / review comments with \`@pi\` also update this branch."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "pi: ${TITLE}" --body "$BODY"
            echo "Updated PR #${EXISTING}"
            echo "pr_number=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh pr create \
              --title "pi: ${TITLE}" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH")
            echo "Created $URL"
            echo "pr_number=$(echo "$URL" | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment status
        if: always() && steps.ctx.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.PI_BOT_TOKEN }}
          MODE: ${{ steps.ctx.outputs.mode }}
          NUMBER: ${{ steps.ctx.outputs.number }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          NEW_PR: ${{ steps.openpr.outputs.pr_number }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${CHANGED:-false}" = "true" ]; then
            if [ "$MODE" = "pr" ]; then
              MSG="pi pushed updates to \`${BRANCH}\` on this PR.

          Run: $RUN_URL"
            else
              if [ -n "${NEW_PR:-}" ]; then
                PR_URL="${{ github.server_url }}/${{ github.repository }}/pull/${NEW_PR}"
              else
                PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')
              fi
              MSG="pi finished. PR: ${PR_URL:-branch \`$BRANCH\`}

          Run: $RUN_URL"
            fi
          else
            MSG="pi finished with no file changes (or failed before commit).

          Run: $RUN_URL"
          fi

          gh issue comment "$NUMBER" --body "$MSG"
